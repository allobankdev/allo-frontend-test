  <circle cx="60" cy="15" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="170" cy="25" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="140" cy="50" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="30" cy="70" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="180" cy="80" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="50" cy="150" r="1" fill="#ffffff" opacity="0.4"/>
