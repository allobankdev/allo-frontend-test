name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fast checks first — fail here before spending time on the slower build step.
      # lint:ci runs eslint without --fix: CI should report problems, not silently patch
      # the checked-out code and pass regardless.
      - run: npm run lint:ci
      - run: npm run type-check
      - run: npm run test

      - run: npm run build
